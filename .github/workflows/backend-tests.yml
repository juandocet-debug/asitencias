name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  django-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.local
      SECRET_KEY: ci-only-secret-key-with-at-least-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt
      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Run Django tests
        run: python manage.py test --verbosity 1
      - name: Check production security settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
          DATABASE_URL: sqlite:///ci-production-check.sqlite3
          ALLOWED_HOSTS: api.example.edu.co
          CORS_ALLOWED_ORIGINS: https://app.example.edu.co
          CSRF_TRUSTED_ORIGINS: https://app.example.edu.co
          SECRET_KEY: ci-production-check-only-74e060f3-75fb-456b-a89f-0723011be700
        run: python manage.py check --deploy
