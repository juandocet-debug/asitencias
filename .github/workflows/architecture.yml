name: Architecture checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  file-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce 500-line source limit
        run: python scripts/check_file_size.py
